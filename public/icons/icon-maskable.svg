    <path d="M16 33L32 39V42L16 36Z" fill="#047857"/>
    <path d="M32 39L48 33V36L32 42Z" fill="#065f46"/>
    <!-- Top Book (Cyan) -->
    <path d="M18 22L32 28L46 22L32 16Z" fill="url(#book-cyan)"/>
